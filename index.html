
<!DOCTYPE html>
<html>
<head>

    <title>SKU Generator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://pyscript.net/releases/2025.2.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.2.3/core.js"></script>

    <style>

        body {
            background-color: #fefeff;
        }

        .container {
            padding-top: 50px;
            padding-bottom: 50px;
        }

        .main-card {
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .header {
            background-color: #1ad1ff;
            color: white;
            padding: 30px;
            text-align: center;
        }

        .generate-button {
            background-color: #1ad1ff;
            border: none;
            color: white;
            width: 100%;
            padding: 10px;
            border-radius: 6px;
        }

        .result {
            margin-top: 20px;
            padding-top: 20px;
            text-align: center;
        }

        

    </style>

</head>

<body>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="main-card">

                <div class="header">
                    <h2>SKU Generator</h2>
                    <p>Make SKU for your product</p>
                </div>

                <div class="p-4">

                    <label>Product Category</label>

                    <select id="category" class="form-control mb-3">
                        <option value="Perishables">Consumables</option>
                        <option value="Clothing">Clothing</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Cosmetics">Miscellaneous</option>
                        <option value="Furniture">Furniture</option>
                    </select>

                    <label>Product Name</label>

                    <input type="text" id="product_name"
                           class="form-control mb-3"
                           placeholder="e.g. Water">

                    <label>Stock Quantity</label>

                    <input type="number" id="quantity"
                           class="form-control mb-3"
                           placeholder="e.g. 10">

                    <button class="generate-button"
                            py-click="SKU_generator">
                        Generate SKU
                    </button>

                    <div class="result" id="sku_output">
                        SKU appears here
                    </div>

                </div>

            </div>

        </div>

    </div>

    

</div>

<py-script src="main.py"></py-script>

</body>
</html>
