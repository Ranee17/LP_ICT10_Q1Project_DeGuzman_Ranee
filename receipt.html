<!DOCTYPE html>
<html>
<head>

    <title>Receipt</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://pyscript.net/releases/2025.2.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.2.3/core.js"></script>

    <style>

        body {
            background-color: #fefeff;
        }

        .container {
            padding-top: 50px;
            padding-bottom: 50px;
        }

        .main-card {
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .header {
            background-color: #1ad1ff;
            color: white;
            padding: 30px;
            text-align: center;
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin-bottom: 8px;
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .order-button {
            background-color: #1ad1ff;
            border: none;
            color: white;
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
        }

        .receipt {
            margin-top: 20px;
            padding: 20px;
            border-top: 1px solid #ddd;
        }

    

    </style>

</head>

<body>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="main-card">

                <div class="header">
                    <h2>Receipt</h2>
                    <p>Total Amount</p>
                </div>

                <div class="p-4">

                    <h5>Menu</h5>

                    <div class="menu-item">
                        <label>
                            <input type="checkbox" id="item1" value="199">
                            Matcha Latte (with whipped cream)
                        </label>
                        <span>₱199</span>
                    </div>

                    <div class="menu-item">
                        <label>
                            <input type="checkbox" id="item2" value="129">
                            Hojicha Latte
                        </label>
                        <span>₱129</span>
                    </div>

                    <div class="menu-item">
                        <label>
                            <input type="checkbox" id="item3" value="189">
                            Decaf
                        </label>
                        <span>₱80</span>
                    </div>

                    <div class="menu-item">
                        <label>
                            <input type="checkbox" id="item4" value="159">
                            Caramel Macchiato (with whipped cream)
                        </label>
                        <span>₱159</span>
                    </div>

                    <div class="menu-item">
                        <label>
                            <input type="checkbox" id="item5" value="129">
                            Americano
                        </label>
                        <span>₱129</span>
                    </div>

                    <button class="order-button" py-click="create_order">
                        Create Receipt
                    </button>

                    <div class="receipt" id="show">
                        Receipt will appear here
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<py-script src="main.py"></py-script>

</body>
</html>
